# Render Blueprint for PropertyState AI
# Deploys backend (FastAPI + SQLite) and frontend (Next.js) as two web services.
#
# Setup:
#   1. Push this repo to GitHub
#   2. In the Render dashboard: New → Blueprint → connect this repo
#   3. Render will read this file and propose the two services
#   4. Set the env vars marked `sync: false` (see notes below)
#   5. Click "Apply" — first deploy takes ~5 minutes
#
# After the FIRST deploy, you'll have two URLs:
#   - https://propertystate-backend-XXXX.onrender.com
#   - https://propertystate-frontend-XXXX.onrender.com
#
# Then go back to the dashboard and fill in the cross-service URLs:
#   Backend → ALLOWED_ORIGINS = https://propertystate-frontend-XXXX.onrender.com
#   Backend → FRONTEND_URL    = https://propertystate-frontend-XXXX.onrender.com
#   Frontend → NEXT_PUBLIC_API_URL = https://propertystate-backend-XXXX.onrender.com
# Then click "Manual Deploy" on each service to rebuild with the new values.
#
# The Starter plan ($7/mo each) is recommended so services don't sleep and the
# backend gets a 1GB persistent disk for SQLite. Free tier works for testing
# but the disk is ephemeral so SQLite data is lost on restart.

services:
  # ────────────────────────────────────────────────────────────────────────────
  # Backend — FastAPI + SQLite
  # ────────────────────────────────────────────────────────────────────────────
  - type: web
    name: propertystate-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter          # $7/mo — no sleep + persistent disk
    region: oregon         # change to singapore, frankfurt, ohio etc if needed
    healthCheckPath: /health
    autoDeploy: true       # auto-redeploy on push to main
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # ── Required — set in dashboard ──
      - key: ANTHROPIC_API_KEY
        sync: false                        # never commit; set in dashboard
      - key: ALLOWED_ORIGINS
        sync: false                        # set after frontend deploys: https://<frontend-url>
      - key: FRONTEND_URL
        sync: false                        # same as ALLOWED_ORIGINS (used for email links + OAuth callbacks)

      # ── Auto-generated by Render ──
      - key: JWT_SECRET
        generateValue: true                # Render generates a 256-bit random string

      # ── Defaults (override in dashboard if needed) ──
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEFAULT_MODEL
        value: claude-sonnet-4-6
      - key: MAX_TOKENS
        value: "2048"
      - key: DATA_DIR
        value: /app/data
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: EMAIL_PROVIDER
        value: console                     # change to "resend" once you have RESEND_API_KEY

      # ── Optional integrations — set in dashboard if you use them ──
      - key: SENTRY_DSN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false                        # e.g. "PropertyState AI <no-reply@yourdomain.com>"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

  # ────────────────────────────────────────────────────────────────────────────
  # Frontend — Next.js (standalone)
  # ────────────────────────────────────────────────────────────────────────────
  - type: web
    name: propertystate-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: starter          # $7/mo — no sleep
    region: oregon         # keep same region as backend for lower latency
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # ── Required — set in dashboard BEFORE first build ──
      # NEXT_PUBLIC_* vars are baked into the build, so this must be set before
      # the first deploy. After the backend deploys, set this to the backend URL
      # and click "Manual Deploy" → "Clear cache and deploy" to rebuild.
      - key: NEXT_PUBLIC_API_URL
        sync: false                        # e.g. https://propertystate-backend-XXXX.onrender.com
